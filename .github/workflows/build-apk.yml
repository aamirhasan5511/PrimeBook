name: Build PrimeBook APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q PrimeBook_phase1.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build
        working-directory: PrimeBook
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PrimeBook-debug-apk
          path: PrimeBook/app/build/outputs/apk/debug/*.apk
